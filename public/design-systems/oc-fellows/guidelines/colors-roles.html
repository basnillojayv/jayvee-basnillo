<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}</style></head><body><div class="wrap"><div style="display:flex;gap:10px;align-items:stretch">
<div style="flex:2;background:var(--surface-navy);color:var(--text-inverse);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-size:11px;letter-spacing:.14em;color:var(--aqua-500)">DARK SECTION</span><span style="font-size:13px;font-weight:700">--surface-navy</span></div>
<div style="flex:1;background:var(--surface-aqua);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:flex-end;font-size:13px;font-weight:700;color:var(--navy-500)">--surface-aqua</div>
<div style="flex:1;background:var(--surface-cream);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:flex-end;font-size:13px;font-weight:700;color:var(--navy-500)">--surface-cream</div>
<div style="flex:1;background:var(--action-primary-bg);color:#fff;border-radius:var(--radius-sm);padding:14px;display:flex;align-items:flex-end;font-size:13px;font-weight:700">--action-primary-bg</div>
</div><p style="margin:0;font-size:12px;color:var(--text-muted)">Roughly 60% white / cream, 25% navy or aqua, 10% slate, 5% orange. Teal is a garnish only.</p></div></body></html>
