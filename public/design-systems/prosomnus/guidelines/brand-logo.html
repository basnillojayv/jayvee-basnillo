<html>
<head>

  <div class="col"><img class="lockup" src="../assets/prosomnus-logo.svg" alt="ProSomnus"><div class="lab">Primary lockup</div></div>
  <div class="col"><img class="mark" src="../assets/prosomnus-mark.svg" alt="ProSomnus mark"><div class="lab">Mark only</div></div>
