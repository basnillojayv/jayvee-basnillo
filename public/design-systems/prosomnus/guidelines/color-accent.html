<!-- @dsCard group="Colors" viewport="700x170" name="Accent — Amber" subtitle="Reserved for the ONE primary CTA per view." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .wrap { display: flex; gap: 24px; align-items: center; }
  .row { display: flex; gap: 14px; flex: 1; }
  .sw { flex: 1; }
  .chip { height: 68px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-heading); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, monospace; }
  .btn { background: var(--color-accent); color: var(--color-on-accent); font-weight: 600; font-size: 15px; padding: 13px 24px; border-radius: var(--radius-sm); box-shadow: var(--shadow-md); white-space: nowrap; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--amber-50)"></div><div class="name">Amber 50</div><div class="hex">#FEF3C7</div></div>
      <div class="sw"><div class="chip" style="background:var(--amber-500)"></div><div class="name">Amber 500 · Accent</div><div class="hex">#FBBF24</div></div>
      <div class="sw"><div class="chip" style="background:var(--amber-700)"></div><div class="name">Amber 700 · Dark</div><div class="hex">#92610A</div></div>
    </div>
    <div class="btn">Get started</div>
  </div>
</body>
</html>
