<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Blue" subtitle="Trust & calm. The system's anchor color." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 68px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-heading); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="name">Blue 50</div><div class="hex">#EAF1FA</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="name">Blue 100</div><div class="hex">#CFE0F2</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="name">Blue 500 · Primary</div><div class="hex">#2261AE</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="name">Blue 700 · Dark</div><div class="hex">#16457E</div></div>
  </div>
</body>
</html>
