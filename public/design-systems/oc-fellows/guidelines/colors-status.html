<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}</style></head><body><div class="wrap"><div style="display:flex;gap:10px">
<div style="flex:1;background:var(--status-success-bg);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="width:22px;height:22px;border-radius:999px;background:var(--status-success)"></span><span style="font-size:12px;font-weight:700;color:var(--status-success)">Success</span></div><div style="flex:1;background:var(--status-warning-bg);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="width:22px;height:22px;border-radius:999px;background:var(--status-warning)"></span><span style="font-size:12px;font-weight:700;color:var(--status-warning)">Warning</span></div><div style="flex:1;background:var(--status-danger-bg);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="width:22px;height:22px;border-radius:999px;background:var(--status-danger)"></span><span style="font-size:12px;font-weight:700;color:var(--status-danger)">Danger</span></div><div style="flex:1;background:var(--status-info-bg);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px"><span style="width:22px;height:22px;border-radius:999px;background:var(--status-info)"></span><span style="font-size:12px;font-weight:700;color:var(--status-info)">Info</span></div>
</div><p style="margin:0;font-size:12px;color:var(--text-muted)">Invented for this system. Not part of the OC Fellows brand.</p></div></body></html>
