<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals" subtitle="Text & background greys, warm-cool balanced." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 60px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-heading); margin-top: 8px; }
  .hex { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--white)"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="name">Gray 50</div><div class="hex">#F9FAFB</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="name">Gray 100</div><div class="hex">#F3F4F6</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="name">Gray 200</div><div class="hex">#E5E7EB</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="name">Gray 400</div><div class="hex">#9CA3AF</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="name">Gray 500</div><div class="hex">#6B7280</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="name">Gray 700</div><div class="hex">#374151</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="name">Gray 900 · Text</div><div class="hex">#1F2937</div></div>
  </div>
</body>
</html>
