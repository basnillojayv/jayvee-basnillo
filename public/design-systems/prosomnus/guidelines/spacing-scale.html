<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base — 4 · 8 · 12 · 16 · 24 · 32 · 48." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .bar { background: var(--blue-100); border-radius: 4px; }
  .lab { font-size: 12px; color: var(--text-heading); font-weight: 600; margin-top: 8px; }
  .tok { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="lab">4</div><div class="tok">space-1</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="lab">8</div><div class="tok">space-2</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="lab">12</div><div class="tok">space-3</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="lab">16</div><div class="tok">space-4</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="lab">24</div><div class="tok">space-6</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="lab">32</div><div class="tok">space-8</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="lab">48</div><div class="tok">space-12</div></div>
  </div>
</body>
</html>
