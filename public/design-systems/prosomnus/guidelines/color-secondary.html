<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Cyan" subtitle="The bright crescent blue. Supporting accents & reassurance." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 68px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-heading); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cyan-50)"></div><div class="name">Cyan 50</div><div class="hex">#E1F4FC</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-100)"></div><div class="name">Cyan 100</div><div class="hex">#BFE7F8</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-500)"></div><div class="name">Cyan 500 · Secondary</div><div class="hex">#009AD9</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-700)"></div><div class="name">Cyan 700 · Dark</div><div class="hex">#06618B</div></div>
  </div>
</body>
</html>
