<!-- @dsCard group="Spacing" viewport="700x160" name="Interaction states" subtitle="Hover darkens · press nudges 1px · focus is a teal ring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}</style></head><body><div class="wrap"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span style="padding:12px 26px;border-radius:999px;background:var(--orange-500);color:#fff;font-size:14px;font-weight:600">Default</span>
<span style="padding:12px 26px;border-radius:999px;background:var(--orange-600);color:#fff;font-size:14px;font-weight:600">Hover</span>
<span style="padding:12px 26px;border-radius:999px;background:var(--orange-700);color:#fff;font-size:14px;font-weight:600;transform:translateY(1px)">Press</span>
<span style="padding:12px 26px;border-radius:999px;background:var(--orange-500);color:#fff;font-size:14px;font-weight:600;box-shadow:var(--ring-focus)">Focus</span>
<span style="padding:12px 26px;border-radius:999px;background:var(--disabled-bg);color:var(--disabled-fg);font-size:14px;font-weight:600">Disabled</span>
</div></div></body></html>
