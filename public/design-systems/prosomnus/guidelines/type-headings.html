<!-- @dsCard group="Type" viewport="700x260" name="Headings — Newsreader" subtitle="Newsreader serif, semibold. H1 48 / H2 32 / H3 24." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 24px; }
  .h { font-family: var(--font-heading); font-weight: 600; color: var(--text-heading); line-height: 1.15; letter-spacing: var(--tracking-tight); margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .meta { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }
  .item { display: flex; align-items: baseline; gap: 14px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="item"><h1 class="h" style="font-size:48px">Sleep, restored</h1><span class="meta">H1 · 48 / 600</span></div>
    <div class="item"><h2 class="h" style="font-size:32px">A better way to breathe</h2><span class="meta">H2 · 32 / 600</span></div>
    <div class="item"><h3 class="h" style="font-size:24px">Custom-fit for comfort</h3><span class="meta">H3 · 24 / 600</span></div>
    <div class="item"><h4 class="h" style="font-size:20px;font-weight:500">Covered by your insurance</h4><span class="meta">H4 · 20 / 500</span></div>
  </div>
</body>
</html>
