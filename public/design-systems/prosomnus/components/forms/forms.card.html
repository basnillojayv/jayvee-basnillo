<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: 24px; }
  .panel { background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 24px; }
  .grp { margin-bottom: 22px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Input, Select, Checkbox, Radio, Switch, Icon } = window.DesignSystem_e5ed69;
  function Demo() {
    return (
      <div className="panel">
        <div className="grp">
          <div className="lbl">Buttons</div>
          <div className="row">
            <Button variant="accent" size="lg">Get started</Button>
            <Button variant="primary">Save</Button>
            <Button variant="secondary" iconLeft={<Icon name="download" size={16} />}>Download</Button>
            <Button variant="ghost">Cancel</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>
        <div className="cols">
          <div className="grp">
            <div className="lbl">Inputs</div>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <Input label="Email" type="email" placeholder="you@example.com" iconLeft={<Icon name="mail" size={16} />} />
              <Input label="ZIP code" defaultValue="0000" error="Please enter a valid ZIP" />
              <Select label="Insurance" options={['Aetna','Cigna','Medicare','VA benefits']} />
            </div>
          </div>
          <div className="grp">
            <div className="lbl">Selection</div>
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <Checkbox label="I agree to the privacy policy" defaultChecked />
              <Radio options={['Patient','Dentist','Physician']} defaultValue="Patient" />
              <Switch label="Email reminders" defaultChecked />
            </div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
