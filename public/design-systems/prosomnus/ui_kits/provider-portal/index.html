<!-- @dsCard group="Provider Portal" viewport="1280x820" name="Provider portal" subtitle="Case dashboard, patient detail & new prescription flow" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProSomnus — Provider Portal</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--text-body); }
  h1,h2,h3 { font-family: var(--font-heading); color: var(--text-heading); margin: 0; letter-spacing: var(--tracking-tight); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 999px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="CaseDetail.jsx"></script>
<script type="text/babel" src="NewRx.jsx"></script>
<script type="text/babel">
  const { Sidebar, Topbar, Dashboard, CaseDetail, NewRx } = window.PP;
  function App() {
    const [view, setView] = React.useState('dashboard'); // 'dashboard' | 'case'
    const [activeCase, setActiveCase] = React.useState(null);
    const [rxOpen, setRxOpen] = React.useState(false);
    const openCase = (c) => { setActiveCase(c); setView('case'); };
    return (
      <div style={{ display: 'flex', minHeight: '100vh' }}>
        <Sidebar view={view} onHome={() => setView('dashboard')} onNewRx={() => setRxOpen(true)} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
          <Topbar onNewRx={() => setRxOpen(true)} />
          <main style={{ padding: 32, flex: 1 }}>
            {view === 'dashboard'
              ? <Dashboard onOpenCase={openCase} onNewRx={() => setRxOpen(true)} />
              : <CaseDetail data={activeCase} onBack={() => setView('dashboard')} />}
          </main>
        </div>
        <NewRx open={rxOpen} onClose={() => setRxOpen(false)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
