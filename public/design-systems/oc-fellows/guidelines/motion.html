<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:var(--surface-page)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}</style></head><body><div class="wrap">
<div style="display:flex;gap:12px"><div style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:11px"><div style="font-size:16px;font-weight:700;color:var(--navy-500)">140ms</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">--dur-fast</div><div style="font-size:11px;color:var(--text-body);margin-top:4px">colour</div></div><div style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:11px"><div style="font-size:16px;font-weight:700;color:var(--navy-500)">220ms</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">--dur-base</div><div style="font-size:11px;color:var(--text-body);margin-top:4px">shadow, transform</div></div><div style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:11px"><div style="font-size:16px;font-weight:700;color:var(--navy-500)">420ms</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">--dur-slow</div><div style="font-size:11px;color:var(--text-body);margin-top:4px">image scale</div></div><div style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:11px"><div style="font-size:16px;font-weight:700;color:var(--navy-500)">700ms</div><div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">--dur-reveal</div><div style="font-size:11px;color:var(--text-body);margin-top:4px">scroll reveal</div></div></div>
<p style="margin:0;font-size:12px;color:var(--text-muted)">All on cubic-bezier(.22,.61,.36,1). Reduced motion collapses every duration to 0.</p></div></body></html>
