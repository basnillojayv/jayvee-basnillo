<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProSomnus — Sleep Better Without the Machine</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); color: var(--text-body); overflow-x: hidden; }
  h1,h2,h3,h4 { font-family: var(--font-heading); color: var(--text-heading); margin: 0; letter-spacing: -0.015em; font-weight: 600; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 40px; }
  section { scroll-margin-top: 92px; }

  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--color-primary); }

  /* Skip link (a11y) */
  .skip-link { position: absolute; left: 16px; top: -60px; z-index: 200; background: var(--color-primary); color: #fff;
    padding: 10px 18px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; transition: top var(--duration-base) var(--ease-out); }
  .skip-link:focus { top: 16px; outline: 3px solid var(--amber-500); outline-offset: 2px; }

  /* Global keyboard focus (a11y) */
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--color-primary); outline-offset: 2px; border-radius: 4px;
  }

  /* Scroll reveal — gentle & calm */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity 1s var(--ease-out), transform 1s var(--ease-out); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } }

  /* Responsive */
  @media (max-width: 900px) {
    .wrap { padding: 0 22px; }
    .grid-3 { grid-template-columns: 1fr !important; }
    .grid-2 { grid-template-columns: 1fr !important; }
    .hero-grid { grid-template-columns: 1fr !important; }
    .desktop-only { display: none !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="SocialProof.jsx"></script>
<script type="text/babel" src="Benefits.jsx"></script>
<script type="text/babel" src="HowItWorks.jsx"></script>
<script type="text/babel" src="Testimonials.jsx"></script>
<script type="text/babel" src="ProviderTrust.jsx"></script>
<script type="text/babel" src="FinalCTA.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const H = window.HP;
  function useReveal() {
    React.useEffect(() => {
      const io = new IntersectionObserver((es) => {
        es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);
  }
  function App() {
    useReveal();
    return (
      <div>
        <a href="#main" className="skip-link">Skip to content</a>
        <H.Nav />
        <main id="main">
          <H.Hero />
          <H.SocialProof />
          <H.Benefits />
          <H.HowItWorks />
          <H.Testimonials />
          <H.ProviderTrust />
          <H.FinalCTA />
        </main>
        <H.Footer />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
