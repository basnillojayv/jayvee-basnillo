<!-- @dsCard group="Brand" viewport="1280x820" name="Brand & Style Guide" subtitle="15-page interactive brand system guide" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProSomnus — Brand & Style Guide</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-body); color: var(--text-body); background: var(--gray-900); }
  h1,h2,h3,h4 { font-family: var(--font-heading); color: var(--text-heading); margin: 0; letter-spacing: -0.015em; }
  a { color: inherit; text-decoration: none; }

  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* ---------- Sidebar (light theme, matches provider portal) ---------- */
  .side { background: var(--surface-card); color: var(--text-body); border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; padding: 24px 0; overflow-y: auto; }
  .side-head { padding: 4px 24px 20px; }
  .side-head img { height: 28px; }
  .side-sub { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-top: 10px; display: flex; align-items: center; gap: 7px; }
  .side-sub .d { width: 7px; height: 7px; border-radius: 50%; background: var(--amber-500); }

  .nav { flex: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--text-muted); padding: 8px 12px 6px; }
  .navItem { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: var(--radius-sm);
    cursor: pointer; border: none; background: none; width: 100%; text-align: left; color: var(--text-body);
    font-family: var(--font-body); font-size: 14.5px; text-decoration: none; transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out); }
  .navItem:hover { background: var(--surface-soft); }
  .navItem .num { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--text-muted); width: 22px; letter-spacing: 0; display: inline-flex; align-items: center; }
  .navItem.active { background: var(--blue-50); color: var(--color-primary); font-weight: 600; }
  .navItem.active .num { color: var(--color-primary); }
  .navItem.active .lbl { font-weight: 600; }
  .navLink .lbl { flex: 1; }
  .navLink .ext { color: var(--gray-300); flex-shrink: 0; }
  .navLink:hover { color: var(--color-primary); }
  .navLink:hover .num, .navLink:hover .ext { color: var(--color-primary); }

  .side-foot { padding: 20px 24px 4px; border-top: 1px solid var(--border-subtle); margin: 12px 16px 0; }
  .side-foot div { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); line-height: 1.9; }

  /* ---------- Stage ---------- */
  .stage { position: relative; overflow: hidden; background: var(--gray-100); }
  .stageScroll { position: absolute; inset: 0; overflow-y: auto; }
  .page { min-height: 100%; animation: bg-fade var(--duration-slow) var(--ease-out); }
  @keyframes bg-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .pageChrome { position: absolute; top: 22px; right: 30px; z-index: 5; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }

  /* ---------- Cover : night into morning ---------- */
  .cover { min-height: 100%; position: relative; overflow: hidden; color: #fff;
    display: flex; flex-direction: column; justify-content: space-between; padding: 60px 72px;
    background: #060E1C; }
  /* layered sky: midnight top → deep navy → a warm dawn band low on the horizon */
  .cover .sky { position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(140% 88% at 50% 118%, rgba(251,191,36,0.30) 0%, rgba(251,191,36,0.10) 20%, rgba(0,154,217,0.16) 40%, transparent 62%),
      linear-gradient(180deg, #060E1C 0%, #0A2038 34%, #0C3B6B 66%, #0C447C 100%); }
  /* the dawn horizon line + its bloom */
  .cover .horizon { position: absolute; left: -5%; right: -5%; bottom: 20%; height: 1px; z-index: 1;
    background: linear-gradient(90deg, transparent, rgba(191,231,248,0.55) 30%, rgba(255,240,210,0.9) 50%, rgba(191,231,248,0.55) 70%, transparent);
    box-shadow: 0 0 60px 18px rgba(0,154,217,0.28); }
  .cover .sun { position: absolute; left: 50%; bottom: 20%; transform: translate(-50%, 50%); width: 260px; height: 260px; z-index: 1;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,238,205,0.85) 0%, rgba(251,191,36,0.35) 30%, rgba(0,154,217,0.12) 55%, transparent 70%); filter: blur(2px); }
  /* thin crescent arc echoing the brand mark, up in the night sky */
  .cover .crescent { position: absolute; top: 8%; right: 9%; width: 150px; height: 150px; z-index: 1;
    border-radius: 50%; box-shadow: inset -14px 10px 0 -2px rgba(191,231,248,0.5); transform: rotate(-24deg); opacity: 0.8; }
  .cover .stars i { position: absolute; background: #fff; border-radius: 50%; z-index: 1;
    animation: twinkle 5s var(--ease-in-out) infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) { .cover .stars i { animation: none; opacity: 0.5; } }
  .cover > * { position: relative; z-index: 2; }

  .placeholder { color: var(--text-muted); font-size: 15px; display: flex; align-items: center; justify-content: center; min-height: 100%; text-align: center; }

  /* ---------- Interior pages : light "morning" surface ---------- */
  .ipage { min-height: 100%; background: var(--surface-card); color: var(--text-body); }
  .ihead { position: relative; overflow: hidden; padding: 52px 64px 44px;
    background: linear-gradient(170deg, var(--blue-50) 0%, #EEF5FC 55%, var(--surface-card) 100%);
    border-bottom: 1px solid var(--border-subtle); color: var(--text-body); }
  .ihead .hzn { display: none; }
  .ihead .glow { position: absolute; width: 440px; height: 440px; border-radius: 50%; top: -220px; right: -60px;
    background: radial-gradient(circle, rgba(0,154,217,0.16), transparent 66%); z-index: 0; }
  .ihead .wm { position: absolute; right: 56px; top: 20px; font-family: var(--font-heading); font-weight: 600;
    font-size: 150px; line-height: 1; color: rgba(34,97,174,0.06); z-index: 0; letter-spacing: -0.03em; }
  .ihead > * { position: relative; z-index: 2; }
  .ihead .eyebrow2 { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--color-primary);
    display: flex; align-items: center; gap: 9px; }
  .ihead .eyebrow2 .d { width: 7px; height: 7px; border-radius: 50%; background: var(--amber-500); box-shadow: 0 0 10px 1px rgba(251,191,36,0.55); }
  .ihead h1 { font-size: clamp(34px, 4.4vw, 54px); line-height: 1.04; color: var(--text-heading); margin: 16px 0 0; }
  .ihead .intro { font-size: 18px; line-height: 1.6; color: var(--text-body); max-width: 640px; margin: 16px 0 0; }

  .ibody { padding: 48px 64px 80px; max-width: 1180px; }
  .isec { margin-top: 52px; }
  .isec:first-child { margin-top: 0; }
  .isecHead { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
  .isecHead .k { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--color-primary); }
  .isecHead h2 { font-size: 24px; color: var(--text-heading); }
  .isecHead .sub { font-size: 14px; color: var(--text-muted); margin-left: auto; }

  .panel { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); }
  .panelSoft { background: var(--surface-soft); border-radius: var(--radius-md); }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
  .g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .prose { font-size: 16px; line-height: 1.7; color: var(--text-body); max-width: 680px; }
  .prose p { margin: 0 0 16px; }

  @media (max-width: 1100px) { .g4 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px) {
    .ihead { padding: 40px 28px 80px; }
    .ibody { padding: 36px 28px 64px; }
    .g2,.g3,.g4 { grid-template-columns: 1fr; }
    .ihead .wm { font-size: 90px; }
  }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .side { height: auto; }
    .stage { height: 80vh; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="bg-shared.jsx"></script>
<script type="text/babel" src="pages-foundation.jsx"></script>
<script type="text/babel" src="pages-system.jsx"></script>
<script type="text/babel" src="pages-components.jsx"></script>
<script type="text/babel" src="pages-extra.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel">
  const { Icon } = window.DesignSystem_e5ed69;
  const PAGES = window.BRANDGUIDE_PAGES;
  const LIVE_PAGES = [
    { label: 'Homepage', icon: 'home', href: '../homepage/index.html' },
    { label: 'How It Works', icon: 'route', href: '../pages/how-it-works/index.html' },
    { label: 'Find a Provider', icon: 'map-pin', href: '../pages/find-a-provider/index.html' },
    { label: 'The Results', icon: 'bar-chart-3', href: '../pages/results/index.html' },
    { label: 'For Providers', icon: 'stethoscope', href: '../pages/providers/index.html' },
    { label: 'FAQ', icon: 'help-circle', href: '../pages/faq/index.html' },
  ];

  function Sidebar({ active, setActive }) {
    return (
      <aside className="side">
        <div className="side-head">
          <img src="../assets/prosomnus-logo.svg" alt="ProSomnus" />
          <div className="side-sub"><span className="d"></span> BRAND SYSTEM</div>
        </div>
        <nav className="nav" aria-label="Brand guide pages">
          <div className="nav-label">Guide</div>
          {PAGES.map((p, i) => (
            <button key={p.num} className={`navItem${i === active ? ' active' : ''}`} onClick={() => setActive(i)} aria-current={i === active ? 'page' : undefined}>
              <span className="num">{p.num}</span>
              <span className="lbl">{p.label}</span>
            </button>
          ))}
          <div className="nav-label" style={{ marginTop: 16 }}>Page Mockups</div>
          {LIVE_PAGES.map((p) => (
            <a key={p.href} className="navItem navLink" href={p.href}>
              <span className="num"><Icon name={p.icon} size={17} /></span>
              <span className="lbl">{p.label}</span>
              <Icon name="arrow-right" size={15} className="ext" />
            </a>
          ))}
        </nav>
        <div className="side-foot">
          <div>DOC · PSX.BRAND.001</div>
          <div>REV · 1.0 · 07.06.2026</div>
          <div>© 2026 ProSomnus Sleep Technologies</div>
        </div>
      </aside>
    );
  }

  function App() {
    const [active, setActive] = React.useState(0);
    const scrollRef = React.useRef(null);
    React.useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [active]);
    const page = PAGES[active];
    const Comp = page.render || (window.BG && window.BG.pages[page.num]);
    return (
      <div className="app">
        <Sidebar active={active} setActive={setActive} />
        <div className="stage">
          <div className="stageScroll" ref={scrollRef}>
            <div className="page" key={active}>
              {Comp ? <Comp /> : <div className="placeholder">Page “{page.num} {page.label}” — coming next, after you approve the structure.</div>}
            </div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
